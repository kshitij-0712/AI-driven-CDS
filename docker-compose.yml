version: "3.9"

services:
  adaptiveshield:
    build:
      context: .
      dockerfile: docker/Dockerfile.core
    container_name: adaptiveshield-core
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      - PYTHONPATH=/app/src
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./runtime:/app/runtime
      - ./config:/app/config
      - ./models:/app/models:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:80/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  dummy-backend:
    image: python:3.11-slim
    container_name: adaptiveshield-dummy-backend
    restart: unless-stopped
    network_mode: host
    volumes:
      - .:/app
    working_dir: /app
    command: python dummy_app/server.py
