version: "3.9"

services:
  adaptiveshield:
    build:
      context: .
      dockerfile: docker/Dockerfile.core
    container_name: adaptiveshield-core
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      - PYTHONPATH=/app/src
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./runtime:/app/runtime
      - ./config:/app/config
      - ./models:/app/models:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
