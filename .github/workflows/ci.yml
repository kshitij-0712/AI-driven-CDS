name: CI

on:
  push:
  pull_request:
    branches: [ main ]

jobs:
  # ──────────────────────────────────────────
  # Job 1: Syntax Check (fastest, runs first)
  # ──────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Syntax check (compileall)
        run: python -m compileall -q src/

  # ──────────────────────────────────────────
  # Job 2: Unit Tests (no model file needed)
  # ──────────────────────────────────────────
  unit-tests:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Run unit tests
        run: |
          PYTHONPATH=src pytest tests/unit/ -v --tb=short

  # ──────────────────────────────────────────
  # Job 3: Regression Tests (needs model file)
  # Only runs on push to main/train, not PRs
  # ──────────────────────────────────────────
  regression-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    if: github.event_name == 'push'
    steps:
      - name: Checkout code (with LFS for model files)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Run regression tests
        run: |
          PYTHONPATH=src pytest tests/regression/ -v --tb=long

  # ──────────────────────────────────────────
  # Job 4: Docker Build (verify containers build)
  # ──────────────────────────────────────────
  docker-build:
    runs-on: ubuntu-latest
    needs: lint
    if: github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker containers
        run: docker compose build --no-cache
