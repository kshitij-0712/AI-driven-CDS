paths:
  raw_logs_dir: "./data/raw_logs"
  processed_dir: "./data/processed"
  binaries_dir: "./data/binaries"
  models_dir: "./models"
  ghidra_output_dir: "./data/processed/ghidra_features"
  input_dir: "./data/input"

ingestors:
  cowrie_input_dir: "./data/input/cowrie"
  dionaea_bistream_dir: "./data/input/dionaea_bistreams"
  zeek_history_dir: "./data/input/zeek/logs"
  zeek_spool_dir: "./data/input/zeek/spool"

# Phase 1: Binary analysis paths
binary_analysis:
  cowrie_downloads_dir: "./data/cowrie/lib/cowrie/downloads"
  dionaea_binaries_dir: "./data/dionaea/lib/dionaea/binaries"
  triage_output_dir: "./data/processed/binary_triage"
  triage_results_file: "./data/processed/binary_triage/all_triage_results.json"

analysis:
  session_link_time_window_sec: 300
  max_log_lines: 150000

ml:
  classes:
    - Safe
    - Recon
    - Downloader
    - Exploit
    - Destructive
    - ADVANCED_APT
  vectorizer_path: "./data/processed/ai_ready/vectorizer_deep.pkl"
  model_path: "./models/brain_v2_deep.pkl"
  enriched_vectorizer_path: "./data/processed/ai_ready/vectorizer_enriched.pkl"
  enriched_model_path: "./models/brain_v3_enriched.pkl"
  deep_v4_vectorizer_path: "./data/processed/ai_ready/vectorizer_deep_v4.pkl"
  deep_v4_model_path: "./models/brain_v4_deep.pkl"
  # Phase 5: Neural model (BiLSTM + structured features)
  neural_v5_model_path: "./models/brain_v5_neural.pkl"
  neural_v5_state_path: "./models/brain_v5_neural.pt"
  neural_v5_results_path: "./models/brain_v5_neural_results.json"

# Phase 5: Neural model training configuration
neural_training:
  max_length: 512
  embed_dim: 64
  lstm_hidden: 128
  lstm_layers: 2
  dropout: 0.3
  batch_size: 64
  lr: 0.001
  epochs: 50
  patience: 7
  loss_type: "combined"  # focal, cost_sensitive, combined, ce
  focal_gamma: 2.0
  downsample_safe: 5000
  synthetic_recon: 500
  synthetic_exploit: 500

# Phase 4: Deep binary analysis paths
deep_analysis:
  ghidra_features_dir: "./data/processed/ghidra_features"
  angr_features_dir: "./data/processed/angr_features"
  script_features_dir: "./data/processed/script_features"
  merged_features_file: "./data/processed/merged_binary_features.json"

# MITRE ATT&CK integration
mitre:
  knowledge_base_module: "core.mitre.attack_mapping"
  session_annotator_module: "core.mitre.session_annotator"
  num_tactic_features: 14
  num_total_mitre_features: 21

# Portable dataset export
export:
  export_dir: "./data/exports"
  files:
    sessions: "sessions.csv"
    downloads: "downloads.csv"
    binary_features: "binary_features.csv"
    session_labels: "session_labels.csv"
    sessions_mitre: "sessions_mitre.csv"
    sessions_complete: "sessions_complete.csv"
    mitre_knowledge_base: "mitre_knowledge_base.json"
    export_manifest: "export_manifest.json"

# Runtime deployment config (HTTP-first guard mode)
deployment:
  mode: "http_guard"
  host: "0.0.0.0"
  port: 80

http_guard:
  enabled: true
  listen_port: 80
  listen_port_ssl: 443
  real_service_host: "127.0.0.1"
  real_service_port: 8090
  request_timeout_sec: 10
  session_idle_timeout_sec: 900
  brute_force_threshold: 8
  block_duration_minutes: 60
  fallback_on_error: true

ssh_guard:
  enabled: true
  listen_port: 2222
#   Why Port 2222?
# We run the proxy on port 2222 instead of 
# the standard 22 for two major reasons:

# Safety: If we bound AdaptiveShield to 22 right now
#  and it crashed, you could be completely locked out of 
# your own Linux machine!
# Conflict: Your real machine likely already has OpenSSH 
# running on port 22. If we try to bind to 22, Docker will 
# crash with Address already in use. (In a real deployment, 
# you would change OpenSSH to run on a secret port, and 
# let AdaptiveShield bind to 22).

  real_service_host: "127.0.0.1"
  real_service_port: 2200
  brute_force_threshold: 5  # Change it to 20 for real world scenarios
  server_key_path: "./config/ssh_host_rsa_key"
  allowed_keys_path: "./config/authorized_keys"

decoys:
  http_image: "nginx:alpine"
  ssh_image: "cowrie/cowrie:latest"
  max_instances: 5
  idle_timeout_sec: 300
  fallback_url: "http://127.0.0.1:8090"
  pre_pull_images:
    - "nginx:alpine"
    - "cowrie/cowrie:latest"
    - "dinotools/dionaea:latest"

runtime:
  db_path: "./runtime/adaptiveshield.db"
  threat_log_path: "./runtime/logs/threat_events.jsonl"
